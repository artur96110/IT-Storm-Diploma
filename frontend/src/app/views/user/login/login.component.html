<div class="login" [formGroup]="loginForm">
  <div class="container">
    <div class="auth-form">
      <div class="auth-title">Войти в личный кабинет</div>

      <div class="auth-inputs">
        <div class="auth-input">
          <input type="text" placeholder="Электронная почта" formControlName="email">
          <div
            *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)">
            <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['required']">
              Необходимо ввести email.
            </div>
            <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['email']">
              Введите корректный email.
            </div>
          </div>
        </div>
        <div class="auth-input password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Пароль"
            formControlName="password">

          <span
            class="password-toggle"
            (click)="togglePassword()">

  <svg *ngIf="!showPassword"
       xmlns="http://www.w3.org/2000/svg"
       width="22"
       height="22"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round">

    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
    <circle cx="12" cy="12" r="3"></circle>

  </svg>

  <svg *ngIf="showPassword"
       xmlns="http://www.w3.org/2000/svg"
       width="22"
       height="22"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round">

    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-7.94"></path>
    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.31 21.31 0 0 1-2.16 3.19"></path>
    <path d="M1 1l22 22"></path>

  </svg>

</span>
          <div
            *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.touched || loginForm.get('password')?.dirty)">
            <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required']">
              Необходимо ввести пароль.
            </div>
          </div>
        </div>
        <div class="auth-checkbox">
          <input type="checkbox" id="rememberMe" formControlName="rememberMe">
          <label for="rememberMe">Запомнить меня</label>
        </div>
      </div>

      <div class="auth-button">
        <button class="button" [disabled]="loginForm.invalid" (click)="logIn()">Войти</button>
      </div>

      <div class="auth-link">
        Нет аккаунта? <a routerLink="/signup">Зарегистрируйтесь</a>
      </div>
    </div>

    <div class="auth-image">
      <img src="/assets/images/login.png" alt="Логин">
    </div>
  </div>
</div>
